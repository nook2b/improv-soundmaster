# Слепое сравнение генераторов для пула записанных мелодий (план Ивана, 2026-10-17).
# Lyria RealTime для пула упёрлась в потолок (3 раунда прослушки, большинство в брак: «быстро»,
# «несколько инструментов», «не тот инструмент»). Живая генерация в шоу остаётся на Lyria RealTime.
#
# Как проводить: каждое задание ниже — в каждом сервисе, по 2 варианта; результаты — на страницу
# прослушки (артефакт «Прослушка пула мелодий») под номерами, без названий сервисов; Иван оценивает,
# победитель записывает весь пул (music_pool в registry.yaml).
#
# Доступ (ключи — только в окружении, не в файлах и не в чате):
#   lyria3       — GEMINI_API_KEY (переменная окружения); модели models/lyria-3-pro-preview,
#                  models/lyria-3.5, models/lyria-3-clip-preview (generateContent). Оплата подключена,
#                  проба 2026-10-17 прошла (Clip, 30 с, ~11 с на трек).
#   elevenlabs   — сетевой секрет: заголовок xi-api-key для api.elevenlabs.io, пути /v1/music
#                  (POST /v1/music, force_instrumental: true, music_length_ms). ~900 кредитов/мин.
#   stability    — сетевой секрет: Authorization: Bearer для api.stability.ai, пути /v2beta/audio/
#                  (Stable Audio 2.5: POST /v2beta/audio/stable-audio-2/text-to-audio).
#   suno         — без API, позже вручную.
#
# Задания пересмотрены по исследованию промптинга (17.10.2026): речь живёт в 1–4 кГц, поэтому инструмент
# звучит НИЖЕ или ВЫШЕ голоса (register), без «мелодии» — мотив из 2–4 нот с паузами или тянущиеся ноты
# (motion), темп не выше 72. Текст промпта собирается из полей по гайду каждого сервиса (короткий, без длинных
# списков «no …» — перечисление инструментов их и вызывает):
#   lyria3       — «Instrumental. … Solo X …» + таймкоды [00:00]/[00:30] «так же тихо, без нарастания»;
#   elevenlabs   — «Solo X in <тональность>, N BPM, …» + force_instrumental;
#   stability    — «Format: Solo | Instruments: … | Moods: … | Style: … | BPM: N»;
#   lyria_rt     — нынешний генератор (база для сравнения): тот же текст, config bpm, без барабанов.
# Обработка у всех одинаковая: первые 60 с, вырез 2–5 кГц на 3 дБ (место для речи), громкость -24 LUFS.
services: [lyria3, elevenlabs, stability, lyria_rt]
variants: 2
seconds: 60
prompts:
  - {id: romance_tender, title: Нежная романтика, genre: romance, instrument: "acoustic piano", register: "high register, single notes only",
     motion: "a gentle three-note motif with long pauses", mood: "tender, warm, intimate", bpm: 66, key: D major}
  - {id: heartbreak, title: Разбитое сердце, genre: drama, instrument: "cello", register: "low register",
     motion: "long sustained bowed notes, slowly descending", mood: "heartbroken, melancholic, restrained", bpm: 60, key: D minor}
  - {id: nostalgia, title: Ностальгия, genre: underscore, instrument: "kalimba", register: "high register",
     motion: "a soft four-note motif with silences", mood: "nostalgic, bittersweet, gentle", bpm: 66, key: G major}
  - {id: loneliness, title: Одиночество, genre: drama, instrument: "bowed double bass (arco)", register: "lowest register",
     motion: "long held notes with silences", mood: "lonely, empty, quiet", bpm: 60, key: E minor}
  - {id: suspicion, title: Подозрение, genre: noir, instrument: "upright double bass, pizzicato", register: "low register",
     motion: "a sparse repeating three-note motif", mood: "suspicious, uncertain, understated", bpm: 64, key: A minor}
  - {id: psychological_tension, title: Психологическое напряжение, genre: thriller, instrument: "violin", register: "very high register, soft harmonics",
     motion: "long held quiet notes with slight dissonance", mood: "uneasy, tense, restrained", bpm: 60, key: C minor}
  - {id: investigation, title: Расследование, genre: noir, instrument: "marimba", register: "low register, soft mallets",
     motion: "a curious repeating four-note motif with gaps", mood: "mysterious, inquisitive, light", bpm: 72, key: E minor}
  - {id: looming_danger, title: Надвигающаяся опасность, genre: horror, instrument: "acoustic piano", register: "lowest register, single notes only",
     motion: "isolated notes with wide gaps", mood: "ominous, uneasy, quiet", bpm: 60, key: B minor}
  - {id: awkward_date, title: Неловкое свидание, genre: comedy, instrument: "violin pizzicato", register: "high register",
     motion: "hesitant short plucked phrases with pauses", mood: "awkward, quirky, shy", bpm: 70, key: F major}
  - {id: silly_fuss, title: Смешная суета, genre: comedy, instrument: "clarinet", register: "low chalumeau register",
     motion: "short playful staccato notes with rests", mood: "mischievous, light, playful", bpm: 72, key: B-flat major}
  - {id: absurd_ceremony, title: Абсурдная церемония, genre: comedy, instrument: "bassoon", register: "low register",
     motion: "pompous but clumsy short detached notes", mood: "deadpan, absurd, dry humor", bpm: 66, key: F major}
  - {id: small_victory, title: Маленькая победа, genre: cartoon, instrument: "glockenspiel", register: "high register, soft mallets",
     motion: "a short cheerful repeating phrase with rests", mood: "charming, gently triumphant", bpm: 72, key: C major}
  - {id: fantasy_journey, title: Фэнтези-путешествие, genre: fantasy, instrument: "celtic harp", register: "high register",
     motion: "a sparse plucked modal folk motif", mood: "wandering, storytelling, magical", bpm: 66, key: D dorian}
  - {id: western, title: Вестерн, genre: western, instrument: "acoustic guitar", register: "low bass strings",
     motion: "slow sparse plucked notes", mood: "dusty, lonesome, frontier", bpm: 64, key: E minor}
  - {id: noir_1940s, title: Нуар 1940-х, genre: noir, instrument: "baritone saxophone", register: "low register, soft and breathy",
     motion: "slow sparse phrases with long breaths", mood: "smoky, melancholic, 1940s film noir", bpm: 60, key: C minor}
  - {id: scifi, title: Фантастика, genre: scifi, instrument: "theremin", register: "high register",
     motion: "slow gliding long notes", mood: "mysterious, weightless, retro sci-fi", bpm: 66, key: A minor}
