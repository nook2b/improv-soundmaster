# Реестр звуков. AI и пульт ссылаются на эффекты только по id отсюда.
# Пути к файлам — относительно sounds_dir. Тестовые звуки: python -m soundmaster make-test-sounds
sounds_dir: ../sounds

global:
  min_gap_between_different_ai_effects: 3.0   # с; серии одного эффекта — его собственные лимиты
  max_ai_actions_per_minute: 6
  dedupe_window: 3.0                           # ≥ late_drop.context
  late_drop:                                   # от границы хода, к которой привязано решение
    context: 3.0
    background: 5.0
    sync: 0.0                                  # синхронные — только через взведение/человека
  suggestion_ttl: 4.0                          # с; подсказка гаснет сама
  scene_end_effect: scene_end
  scene_end: { max_active: 1, pause_after_dismiss: 20, max_per_scene: 3 }

# class: sync (синхронно с действием) | context (событие уже названо) | background (фон)
# mode:  OFF | SUGGEST | AUTO (AUTO — только после допуска, PLAN.md разд. 10–11)
# risk:  low | loud (loud — только человек, никогда AUTO)
effects:
  camera_shutter:
    label: Затвор
    file: sfx/camera_shutter.wav
    channel: sfx
    class: sync
    mode: SUGGEST
    hotkey: "1"
    series: { cooldown: 1.0, count: 5, window: 30 }
    arm:
      triggers: [operator, keyword]
      fire_keywords: ["чик", "щёлк"]
      arm_keywords: ["птичка", "улыбочку"]
      max_timeout: 5

  doorbell:
    label: Дверной звонок
    file: sfx/doorbell.wav
    channel: sfx
    class: context
    mode: SUGGEST
    hotkey: "2"
    cooldown: 5

  phone_ring:
    label: Телефон
    file: sfx/phone_ring.wav
    channel: sfx
    class: context
    mode: SUGGEST
    hotkey: "3"
    cooldown: 5

  knock:
    label: Стук в дверь
    file: sfx/knock.wav
    channel: sfx
    class: context
    mode: SUGGEST
    hotkey: "4"
    cooldown: 3

  hit:
    label: Удар
    file: sfx/hit.wav
    channel: sfx
    class: sync
    mode: SUGGEST
    hotkey: "5"
    cooldown: 0.5

  fall:
    label: Падение
    file: sfx/fall.wav
    channel: sfx
    class: sync
    mode: SUGGEST
    hotkey: "6"
    cooldown: 1

  magic:
    label: Магия
    file: sfx/magic.wav
    channel: sfx
    class: context
    mode: SUGGEST
    hotkey: "7"
    cooldown: 5

  gunshot:
    label: Выстрел
    file: sfx/gunshot.wav
    channel: sfx
    class: sync
    risk: loud            # только явным действием человека
    mode: SUGGEST
    hotkey: "9"
    gain_db: -6
    arm: { triggers: [operator] }

  scene_end:
    label: Отбивка
    file: sting/scene_end.wav
    channel: sting
    risk: loud
    mode: SUGGEST
    hotkey: "0"

# Музыкальные состояния: AI выбирает id, программа — файл и/или проверенный пресет генератора.
# file — библиотечный вариант и резерв генератора. generator — пресет для включённого генератора:
#   test_tone:      root_hz, bpm, chord (полутоны), brightness
#   lyria_realtime: prompts [{text, weight}], config {bpm, density, brightness, ...}
music_states:
  romantic:
    label: Романтика
    channel: music
    file: music/romantic.wav
    hotkey: "q"
    generator:
      root_hz: 220
      bpm: 60
      chord: [0, 4, 7, 11]
      brightness: 0.3
      prompts: [{ text: "soft romantic piano, warm strings, slow", weight: 1.0 }]
      config: { bpm: 70, density: 0.3, brightness: 0.4 }

  tension:
    label: Напряжение
    channel: music
    file: music/tension.wav
    hotkey: "w"
    generator:
      root_hz: 110
      bpm: 90
      chord: [0, 1, 6]
      brightness: 0.6
      prompts: [{ text: "suspenseful low drones, ticking pulse, thriller", weight: 1.0 }]
      config: { bpm: 90, density: 0.5, brightness: 0.3 }

  restaurant:
    label: Ресторан (атмосфера)
    channel: ambience
    file: ambience/restaurant.wav
    hotkey: "e"

  rain:
    label: Дождь (атмосфера)
    channel: ambience
    file: ambience/rain.wav
    hotkey: "r"

# Словарь музыки для генератора (Lyria RealTime). Модель выбирает по одному слову из каждого
# раздела (жанр / настроение / энергия / темп), программа собирает из них запрос к генератору.
# Свободный текст от модели не принимается. text — для генератора (по-английски), label — для пульта.
# fallback у настроения — музыкальное состояние-файл, если генератор недоступен (иначе тишина).
music_vocabulary:
  gain_db: -8
  fade_in: 3
  fade_out: 3
  genres:
    underscore:  { label: "Нейтральный фон", text: "subtle cinematic underscore, soft pads, unobtrusive background music" }
    drama:       { label: "Драма", text: "dramatic orchestral film score, strings and piano" }
    comedy:      { label: "Комедия", text: "quirky comedic underscore, pizzicato strings, bassoon, playful percussion" }
    noir:        { label: "Нуар/детектив", text: "film noir detective jazz, muted trumpet, upright bass, brushed drums" }
    thriller:    { label: "Триллер", text: "thriller underscore, pulsing synth bass, ticking percussion, low strings" }
    horror:      { label: "Ужасы", text: "horror ambience, dissonant strings, eerie drones, sparse piano" }
    romance:     { label: "Романтика", text: "romantic film score, warm strings, gentle piano" }
    western:     { label: "Вестерн", text: "spaghetti western, twangy electric guitar, whistling, harmonica" }
    action:      { label: "Экшн/погоня", text: "action chase music, driving drums, staccato strings, brass hits" }
    fantasy:     { label: "Сказка/фэнтези", text: "fairy tale fantasy music, harp, celesta, flutes, magical" }
    scifi:       { label: "Фантастика", text: "science fiction soundtrack, analog synthesizers, arpeggios, spacey pads" }
    epic:        { label: "Эпос", text: "epic orchestral music, choir, big drums, heroic brass" }
    cartoon:     { label: "Мультфильм", text: "cartoon music, xylophone, slide whistle, bouncy tuba" }
    lounge:      { label: "Бар/лаунж", text: "lounge jazz, smooth piano trio, background bar music" }
    period:      { label: "Старина/классика", text: "baroque chamber music, harpsichord, string quartet" }
    folk:        { label: "Деревня/фолк", text: "folk music, accordion, acoustic guitar, balalaika" }
    electronic:  { label: "Клуб/электроника", text: "electronic dance music, four on the floor beat, synth bass" }
    sport:       { label: "Спорт/соревнование", text: "sports anthem, energetic rock drums, electric guitar riffs" }
  moods:
    tense:       { label: "напряжение", text: "tense, suspenseful", fallback: tension }
    ominous:     { label: "угроза", text: "ominous, dark, threatening", fallback: tension }
    mysterious:  { label: "загадка", text: "mysterious, curious, enigmatic", fallback: tension }
    anxious:     { label: "тревога", text: "anxious, nervous, uneasy", fallback: tension }
    sad:         { label: "грусть", text: "sad, melancholic, sorrowful" }
    tender:      { label: "нежность", text: "tender, loving, intimate", fallback: romantic }
    happy:       { label: "радость", text: "happy, cheerful, bright" }
    playful:     { label: "озорство", text: "playful, mischievous, light-hearted" }
    absurd:      { label: "абсурд", text: "absurd, silly, clumsy, comedic" }
    triumphant:  { label: "триумф", text: "triumphant, victorious, uplifting" }
    calm:        { label: "спокойствие", text: "calm, peaceful, relaxed" }
    nostalgic:   { label: "ностальгия", text: "nostalgic, wistful, bittersweet" }
  energy:
    low:    { label: "тихо", config: { density: 0.2, brightness: 0.3 } }
    medium: { label: "средне", config: { density: 0.45, brightness: 0.5 } }
    high:   { label: "мощно", config: { density: 0.75, brightness: 0.65 } }
  tempo:
    slow:   { label: "медленно", config: { bpm: 70 } }
    medium: { label: "умеренно", config: { bpm: 100 } }
    fast:   { label: "быстро", config: { bpm: 135 } }
