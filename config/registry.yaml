# Реестр звуков. AI и пульт ссылаются на эффекты только по id отсюда.
# Пути к файлам — относительно sounds_dir. Тестовые звуки: python -m soundmaster make-test-sounds
sounds_dir: ../sounds

global:
  min_gap_between_different_ai_effects: 3.0   # с; серии одного эффекта — его собственные лимиты
  max_ai_actions_per_minute: 6
  dedupe_window: 3.0                           # ≥ late_drop.context
  late_drop:                                   # от границы хода, к которой привязано решение
    context: 3.0
    background: 5.0
    sync: 0.0                                  # синхронные — только через взведение/человека
  suggestion_ttl: 4.0                          # с; подсказка гаснет сама
  scene_end_effect: scene_end
  scene_end: { max_active: 1, pause_after_dismiss: 20, max_per_scene: 3 }

# class: sync (синхронно с действием) | context (событие уже названо) | background (фон)
# mode:  OFF | SUGGEST | AUTO (AUTO — только после допуска, PLAN.md разд. 10–11)
# risk:  low | loud (loud — только человек, никогда AUTO)
effects:
  camera_shutter:
    label: Затвор
    file: sfx/camera_shutter.wav
    channel: sfx
    class: sync
    mode: SUGGEST
    hotkey: "1"
    series: { cooldown: 1.0, count: 5, window: 30 }
    arm:
      triggers: [operator, keyword]
      fire_keywords: ["чик", "щёлк"]
      arm_keywords: ["птичка", "улыбочку"]
      max_timeout: 5

  doorbell:
    label: Дверной звонок
    file: sfx/doorbell.wav
    channel: sfx
    class: context
    mode: SUGGEST
    hotkey: "2"
    cooldown: 5

  phone_ring:
    label: Телефон
    file: sfx/phone_ring.wav
    channel: sfx
    class: context
    mode: SUGGEST
    hotkey: "3"
    cooldown: 5

  knock:
    label: Стук в дверь
    file: sfx/knock.wav
    channel: sfx
    class: context
    mode: SUGGEST
    hotkey: "4"
    cooldown: 3

  hit:
    label: Удар
    file: sfx/hit.wav
    channel: sfx
    class: sync
    mode: SUGGEST
    hotkey: "5"
    cooldown: 0.5

  fall:
    label: Падение
    file: sfx/fall.wav
    channel: sfx
    class: sync
    mode: SUGGEST
    hotkey: "6"
    cooldown: 1

  magic:
    label: Магия
    file: sfx/magic.wav
    channel: sfx
    class: context
    mode: SUGGEST
    hotkey: "7"
    cooldown: 5

  gunshot:
    label: Выстрел
    file: sfx/gunshot.wav
    channel: sfx
    class: sync
    risk: loud            # только явным действием человека
    mode: SUGGEST
    hotkey: "9"
    gain_db: -6
    arm: { triggers: [operator] }

  scene_end:
    label: Отбивка
    file: sting/scene_end.wav
    channel: sting
    risk: loud
    mode: SUGGEST
    hotkey: "0"

# Музыкальные состояния — звуки-«фоны» из файлов. Сейчас здесь только атмосфера места (включается
# вручную); музыку ведут словарь music_vocabulary (генератор) и пул записей music_pool (ниже).
# Можно добавить и музыку-файл: {label, channel: music, file, hotkey, generator: {...}}.
music_states:
  # Атмосфера места — только вручную (ai: false): под речь и музыку гул толпы даёт слишком много шума
  # (решение Ивана, 2026-10-06). ai: true — модель снова сможет включать её сама.
  restaurant:
    label: Ресторан (атмосфера)
    channel: ambience
    file: ambience/restaurant.wav
    ai: false
    hotkey: "e"

  restaurant_outside:
    label: Кафе на улице (атмосфера)
    channel: ambience
    file: ambience/restaurant_outside.wav
    ai: false
    hotkey: "t"

  rain:
    label: Дождь (атмосфера)
    channel: ambience
    file: ambience/rain.wav
    ai: false
    hotkey: "r"

# Словарь музыки для генератора (Lyria RealTime). Модель выбирает по одному слову из каждого
# раздела (жанр / настроение / энергия / темп), программа собирает из них запрос к генератору.
# Свободный текст от модели не принимается. text — для генератора (по-английски), label — для пульта.
# Если генератор недоступен — играет запись того же жанра из пула music_pool (ниже).
music_vocabulary:
  gain_db: -8
  fade_in: 3
  fade_out: 3
  # Музыка только сольная (решение Ивана, 2026-10-10): жанр задаёт характер, а не инструменты;
  # инструмент выбирается всегда, к запросу Lyria добавляется этот текст.
  solo: "exactly one unaccompanied solo instrument playing a sparse, simple monophonic melody; no chords, no accompaniment, no percussion, no bass, no pads, no other instruments, no vocals"
  # Темп числом и без барабанов/баса — для всей музыки (решение после прослушки 2026-10-16: «слишком
  # быстро», «вступают другие инструменты»). Слова «slow tempo» Lyria почти не слушает, bpm — слушает.
  # bpm один на всё шоу: его смена в Lyria = сброс контекста (обрыв), а постоянный — без обрывов.
  base_config: { bpm: 66, mute_drums: true, mute_bass: true }
  # Только для записи пула: строже следовать описанию, меньше случайности (ровнее мелодия).
  # Формула из гайда по промптингу Lyria (2026-10-17): «под диалог», ровная динамика, без кульминаций.
  pool_config: { bpm: 60, guidance: 5.0, temperature: 0.8 }
  pool_text: "minimal underscore beneath spoken theatre dialogue, lots of space between notes, soft steady dynamics, constant intensity, no dramatic builds, no climax, no sudden accents, a small repeating loop-friendly motif"
  genres:
    underscore:  { label: "Нейтральный фон", text: "subtle unobtrusive cinematic background, simple sparse melody" }
    drama:       { label: "Драма", text: "dramatic emotional film score feeling, expressive phrasing" }
    comedy:      { label: "Комедия", text: "quirky comedic tune, bouncy staccato phrases" }
    noir:        { label: "Нуар/детектив", text: "film noir detective jazz, smoky bluesy phrasing" }
    thriller:    { label: "Триллер", text: "thriller suspense, repetitive ostinato, pulsing" }
    horror:      { label: "Ужасы", text: "horror film, creepy, dark, eerie dissonant intervals, unsettling tension, sparse" }
    romance:     { label: "Романтика", text: "romantic, warm lyrical melody" }
    western:     { label: "Вестерн", text: "spaghetti western, twangy, wide open desert feeling" }
    action:      { label: "Экшн/погоня", text: "action chase, driving fast repeated notes, urgent" }
    fantasy:     { label: "Сказка/фэнтези", text: "fairy tale fantasy, magical, whimsical" }
    scifi:       { label: "Фантастика", text: "science fiction, spacey arpeggios, otherworldly" }
    epic:        { label: "Эпос", text: "epic heroic grand melody, triumphant phrasing" }
    cartoon:     { label: "Мультфильм", text: "cartoon music, playful bouncy slapstick tune" }
    lounge:      { label: "Бар/лаунж", text: "lounge jazz, smooth relaxed bar music" }
    period:      { label: "Старина/классика", text: "baroque classical period style, ornamented melody" }
    folk:        { label: "Деревня/фолк", text: "folk tune, rustic village dance feeling" }
    electronic:  { label: "Клуб/электроника", text: "electronic dance groove feeling, repetitive hypnotic riff" }
    sport:       { label: "Спорт/соревнование", text: "sports anthem, energetic rousing riff" }
  moods:
    tense:       { label: "напряжение", text: "tense, suspenseful" }
    ominous:     { label: "угроза", text: "ominous, dark, threatening" }
    mysterious:  { label: "загадка", text: "mysterious, curious, enigmatic" }
    anxious:     { label: "тревога", text: "anxious, nervous, uneasy" }
    sad:         { label: "грусть", text: "sad, melancholic, sorrowful" }
    tender:      { label: "нежность", text: "tender, loving, intimate" }
    happy:       { label: "радость", text: "happy, cheerful, bright" }
    playful:     { label: "озорство", text: "playful, mischievous, light-hearted" }
    absurd:      { label: "абсурд", text: "absurd, silly, clumsy, comedic" }
    triumphant:  { label: "триумф", text: "triumphant, victorious, uplifting" }
    calm:        { label: "спокойствие", text: "calm, peaceful, relaxed" }
    nostalgic:   { label: "ностальгия", text: "nostalgic, wistful, bittersweet" }
  energy:
    low:    { label: "тихо", config: { density: 0.12, brightness: 0.3 } }
    medium: { label: "средне", config: { density: 0.25, brightness: 0.45 } }
    high:   { label: "мощно", config: { density: 0.4, brightness: 0.6 } }
  # Инструмент — всегда один. Модель выбирает его на сцену; в соседних сценах инструмент не повторяется.
  instruments:
    guitar:      { label: "гитара", text: "solo nylon-string acoustic guitar, gently fingerpicked single notes" }
    electric:    { label: "электрогитара", text: "solo clean electric guitar with reverb, single-note melody" }
    piano:       { label: "фортепиано", text: "solo soft piano, single-note melody only, no chords, no left-hand accompaniment" }
    violin:      { label: "скрипка", text: "solo violin, one melodic line, measured gentle bowing" }
    pizzicato:   { label: "скрипка пиццикато", text: "solo violin played pizzicato, plucked single notes" }
    cello:       { label: "виолончель", text: "solo cello, sustained gentle notes in a low register" }
    doublebass:  { label: "контрабас", text: "solo upright double bass, softly plucked pizzicato, low register" }
    banjo:       { label: "банджо", text: "solo banjo, gently plucked single notes" }
    harmonica:   { label: "губная гармошка", text: "solo harmonica, single breathy notes" }
    accordion:   { label: "аккордеон", text: "solo accordion, gentle single-note melody, soft bellows" }
    ukulele:     { label: "укулеле", text: "solo ukulele, gently plucked single notes, no strumming" }
    mandolin:    { label: "мандолина", text: "solo mandolin, soft slow tremolo single notes" }
    balalaika:   { label: "балалайка", text: "solo balalaika, Russian folk, soft plucked single notes" }
    harp:        { label: "арфа", text: "solo harp, sparse plucked single notes, no arpeggios" }
    lute:        { label: "лютня", text: "solo medieval lute, gently plucked single notes" }
    flute:       { label: "флейта", text: "solo flute, soft breathy single line" }
    clarinet:    { label: "кларнет", text: "solo clarinet, soft single melodic line" }
    bassoon:     { label: "фагот", text: "solo bassoon, short detached notes" }
    saxophone:   { label: "саксофон", text: "solo tenor saxophone, breathy single melodic line" }
    trumpet:     { label: "труба", text: "solo muted trumpet, one single melodic line" }
    horn:        { label: "валторна", text: "solo French horn, warm noble single line" }
    marimba:     { label: "маримба/ксилофон", text: "solo marimba, soft mallets, gentle single notes" }
    vibraphone:  { label: "вибрафон", text: "solo vibraphone, soft mallets, mellow single notes" }
    celesta:     { label: "челеста", text: "solo celesta, soft magical single notes" }
    kalimba:     { label: "калимба", text: "solo kalimba, delicate single notes" }
    musicbox:    { label: "музыкальная шкатулка", text: "solo music box, delicate single notes" }
    harpsichord: { label: "клавесин", text: "solo harpsichord, single-note melody, no chords" }
    synth:       { label: "синтезатор", text: "one monophonic analog synthesizer voice, soft rounded tone, no pads, no arpeggiator" }
    theremin:    { label: "терменвокс", text: "solo theremin, wavering eerie single line" }
    saw:         { label: "пила", text: "solo musical saw played with a bow, wavering eerie tone" }
    slideguitar: { label: "слайд-гитара", text: "solo dobro slide guitar, dusty single notes" }
  # Темп шоу задан bpm в base_config; слова здесь — характер фраз (быстрее — значит подвижнее, а не гонка).
  tempo:
    slow:   { label: "медленно", text: "very slow, long sustained notes, unhurried" }
    medium: { label: "умеренно", text: "calm relaxed pace, unhurried phrasing" }
    fast:   { label: "быстро", text: "gently moving, light steady pulse, not rushed" }

# Пул записанных мелодий: по 5 на жанр, у каждой свой инструмент (настроение/энергия/темп/инструмент).
# Играют с ручных кнопок жанров на пульте (повторное нажатие — следующая, с плавным переходом) и
# служат резервом, если генератор недоступен (нет интернета). Файлы — sounds/pool/<жанр>/<n>-<инструмент>.flac,
# создаются командой `python -m soundmaster make-music-pool` (Lyria, нужен GEMINI_API_KEY). В git не кладутся.
music_pool:
  # «настроение/энергия/темп/инструмент [@замедление] [| уточнение к промпту]». Раунд 3 (2026-10-17):
  # оставленные на прослушке — без изменений; «мелодия хорошая, но медленнее» — та же запись, замедлена (@0.8);
  # три мелодии «электроники» перенесены в нуар, триллер и фантастику (по оценке Ивана); остальной брак —
  # новая запись по формуле гайда, со стереотипным для жанра инструментом.
  underscore:
    - calm/low/slow/piano | gentle calm, single soft notes with long pauses
    - calm/low/slow/guitar
    - mysterious/low/slow/kalimba | quietly curious, distant
    - nostalgic/low/slow/cello
    - tender/low/medium/musicbox
  drama:
    - tense/low/slow/cello
    - sad/low/slow/piano @0.8
    - tense/low/slow/violin | restrained tension, one violin line only, no second violin, no accompaniment
    - nostalgic/low/slow/guitar
    - sad/low/slow/clarinet @0.85
  comedy:
    - playful/low/slow/ukulele | awkward comedy, tiny hesitations, short playful phrases
    - absurd/low/slow/clarinet | whimsical silent-film comedy, light staccato, mischievous but not frantic
    - playful/low/medium/marimba
    - absurd/low/slow/bassoon | pompous but clumsy, dry deadpan humor
    - playful/low/slow/pizzicato | sneaky tiptoeing comedy
  noir:
    - mysterious/low/slow/saxophone | 1940s film noir, smoky blue notes, long breathing spaces, no piano, no bass, no drums
    - tense/low/slow/trumpet | one muted trumpet only, distant, no other brass
    - happy/medium/medium/synth
    - ominous/low/slow/electric
    - nostalgic/low/slow/clarinet
  thriller:
    - tense/medium/medium/synth
    - calm/low/medium/synth
    - ominous/low/slow/cello
    - tense/medium/fast/violin
    - mysterious/low/slow/electric
  horror:
    - ominous/low/slow/musicbox
    - ominous/low/slow/cello
    - anxious/low/slow/violin | creepy, eerie slow dissonant glissandi and harmonics, unsettling
    - ominous/low/slow/piano | isolated low single notes, wide gaps, soft touch
    - ominous/low/slow/saw | haunting, creepy
  romance:
    - tender/low/slow/piano | warm tender love theme, affectionate
    - tender/low/slow/guitar
    - nostalgic/low/slow/violin
    - tender/low/slow/accordion | French cafe musette, slow romantic waltz feeling
    - tender/low/slow/saxophone
  western:
    - tense/low/slow/harmonica
    - calm/low/slow/guitar | dry dusty frontier melody, quiet, even volume, no loud plucks
    - nostalgic/low/slow/slideguitar | lonesome old west
    - tense/low/slow/electric | spaghetti western twangy guitar riff with tremolo, single notes
    - nostalgic/low/slow/trumpet | one lonely distant trumpet only, no other brass
  action:
    - tense/high/fast/violin
    - tense/high/fast/electric
    - tense/medium/medium/cello | urgent staccato ostinato, quiet but driving
    - triumphant/high/fast/trumpet
    - tense/high/fast/synth
  fantasy:
    - mysterious/low/slow/harp | delicate folk-inspired modal melody, wandering storyteller
    - happy/low/medium/flute
    - tender/low/slow/lute | medieval tavern, wandering storyteller
    - playful/medium/medium/clarinet
    - mysterious/low/slow/celesta | gentle fairy-tale magic, no accents
  scifi:
    - mysterious/low/slow/synth @0.8
    - tense/medium/medium/synth
    - anxious/low/slow/theremin | 1950s science fiction
    - nostalgic/low/slow/synth | weightless space, mysterious signal
    - tense/medium/medium/synth
  epic:
    - triumphant/high/medium/trumpet
    - triumphant/low/slow/horn | heroic, noble, restrained
    - tense/low/slow/cello | grand but restrained, one cello only
    - triumphant/low/slow/violin | heroic, noble, one violin only
    - nostalgic/medium/slow/flute @0.85
  cartoon:
    - playful/medium/fast/marimba
    - absurd/low/slow/clarinet | silly cartoon, light staccato, unhurried
    - playful/low/slow/ukulele | cartoon, gently plucked, tiny pauses
    - absurd/medium/medium/harmonica @0.7
    - absurd/low/slow/bassoon | clumsy cartoon tiptoeing
  lounge:
    - calm/low/medium/piano @0.8
    - calm/low/medium/saxophone
    - calm/low/slow/guitar | clean hollow-body jazz guitar, soft single notes, cool jazz
    - nostalgic/low/slow/trumpet @0.8
    - calm/low/slow/vibraphone | cool jazz lounge, mellow
  period:
    - calm/low/medium/harpsichord @0.8
    - tender/low/slow/violin
    - happy/medium/medium/flute @0.75
    - nostalgic/low/slow/cello @0.8
    - calm/low/slow/harp
  folk:
    - happy/low/slow/accordion | gentle village tune, unhurried
    - nostalgic/low/slow/guitar
    - playful/low/slow/mandolin | gentle village dance, unhurried
    - happy/low/slow/balalaika | slow Russian folk song
    - tender/low/slow/violin
  electronic:
    - happy/low/medium/synth | club-style hypnotic repeating synth riff, deep house feeling
    - calm/low/medium/synth | chill electronic lounge synth lead
    - playful/low/medium/synth | playful bleepy electro synth riff
    - mysterious/low/slow/synth | dark minimal techno synth riff
    - tense/low/medium/synth | pulsing electronic sequence feeling
  sport:
    - triumphant/low/medium/electric | stadium rock anthem guitar riff, confident, not rushed
    - triumphant/low/medium/trumpet | sports fanfare motif, one trumpet only
    - tense/low/medium/synth | competitive pulsing synth riff
    - happy/low/medium/horn | proud victorious horn call
    - triumphant/low/medium/violin | heroic, one violin only
