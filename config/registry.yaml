# Реестр звуков. AI и пульт ссылаются на эффекты только по id отсюда.
# Пути к файлам — относительно sounds_dir. Тестовые звуки: python -m soundmaster make-test-sounds
sounds_dir: ../sounds

global:
  min_gap_between_different_ai_effects: 3.0   # с; серии одного эффекта — его собственные лимиты
  max_ai_actions_per_minute: 6
  dedupe_window: 3.0                           # ≥ late_drop.context
  late_drop:                                   # от границы хода, к которой привязано решение
    context: 3.0
    background: 5.0
    sync: 0.0                                  # синхронные — только через взведение/человека
  suggestion_ttl: 4.0                          # с; подсказка гаснет сама
  scene_end_effect: scene_end
  scene_end: { max_active: 1, pause_after_dismiss: 20, max_per_scene: 3 }

# class: sync (синхронно с действием) | context (событие уже названо) | background (фон)
# mode:  OFF | SUGGEST | AUTO (AUTO — только после допуска, PLAN.md разд. 10–11)
# risk:  low | loud (loud — только человек, никогда AUTO)
effects:
  camera_shutter:
    label: Затвор
    file: sfx/camera_shutter.wav
    channel: sfx
    class: sync
    mode: SUGGEST
    hotkey: "1"
    series: { cooldown: 1.0, count: 5, window: 30 }
    arm:
      triggers: [operator, keyword]
      fire_keywords: ["чик", "щёлк"]
      arm_keywords: ["птичка", "улыбочку"]
      max_timeout: 5

  doorbell:
    label: Дверной звонок
    file: sfx/doorbell.wav
    channel: sfx
    class: context
    mode: SUGGEST
    hotkey: "2"
    cooldown: 5

  phone_ring:
    label: Телефон
    file: sfx/phone_ring.wav
    channel: sfx
    class: context
    mode: SUGGEST
    hotkey: "3"
    cooldown: 5

  knock:
    label: Стук в дверь
    file: sfx/knock.wav
    channel: sfx
    class: context
    mode: SUGGEST
    hotkey: "4"
    cooldown: 3

  hit:
    label: Удар
    file: sfx/hit.wav
    channel: sfx
    class: sync
    mode: SUGGEST
    hotkey: "5"
    cooldown: 0.5

  fall:
    label: Падение
    file: sfx/fall.wav
    channel: sfx
    class: sync
    mode: SUGGEST
    hotkey: "6"
    cooldown: 1

  magic:
    label: Магия
    file: sfx/magic.wav
    channel: sfx
    class: context
    mode: SUGGEST
    hotkey: "7"
    cooldown: 5

  gunshot:
    label: Выстрел
    file: sfx/gunshot.wav
    channel: sfx
    class: sync
    risk: loud            # только явным действием человека
    mode: SUGGEST
    hotkey: "9"
    gain_db: -6
    arm: { triggers: [operator] }

  scene_end:
    label: Отбивка
    file: sting/scene_end.wav
    channel: sting
    risk: loud
    mode: SUGGEST
    hotkey: "0"

# Музыкальные состояния: AI выбирает id, программа — файл и/или проверенный пресет генератора.
# file — библиотечный вариант и резерв генератора. generator — пресет для включённого генератора:
#   test_tone:      root_hz, bpm, chord (полутоны), brightness
#   lyria_realtime: prompts [{text, weight}], config {bpm, density, brightness, ...}
music_states:
  romantic:
    label: Романтика
    channel: music
    file: music/romantic.wav
    hotkey: "q"
    generator:
      root_hz: 220
      bpm: 60
      chord: [0, 4, 7, 11]
      brightness: 0.3
      prompts: [{ text: "soft romantic piano, warm strings, slow", weight: 1.0 }]
      config: { bpm: 70, density: 0.3, brightness: 0.4 }

  tension:
    label: Напряжение
    channel: music
    file: music/tension.wav
    hotkey: "w"
    generator:
      root_hz: 110
      bpm: 90
      chord: [0, 1, 6]
      brightness: 0.6
      prompts: [{ text: "suspenseful low drones, ticking pulse, thriller", weight: 1.0 }]
      config: { bpm: 90, density: 0.5, brightness: 0.3 }

  # Атмосфера места — только вручную (ai: false): под речь и музыку гул толпы даёт слишком много шума
  # (решение Ивана, 2026-10-06). ai: true — модель снова сможет включать её сама.
  restaurant:
    label: Ресторан (атмосфера)
    channel: ambience
    file: ambience/restaurant.wav
    ai: false
    hotkey: "e"

  restaurant_outside:
    label: Кафе на улице (атмосфера)
    channel: ambience
    file: ambience/restaurant_outside.wav
    ai: false
    hotkey: "t"

  rain:
    label: Дождь (атмосфера)
    channel: ambience
    file: ambience/rain.wav
    ai: false
    hotkey: "r"

# Словарь музыки для генератора (Lyria RealTime). Модель выбирает по одному слову из каждого
# раздела (жанр / настроение / энергия / темп), программа собирает из них запрос к генератору.
# Свободный текст от модели не принимается. text — для генератора (по-английски), label — для пульта.
# fallback у настроения — музыкальное состояние-файл, если генератор недоступен (иначе тишина).
music_vocabulary:
  gain_db: -8
  fade_in: 3
  fade_out: 3
  # Музыка только сольная (решение Ивана, 2026-10-10): жанр задаёт характер, а не инструменты;
  # инструмент выбирается всегда, к запросу Lyria добавляется этот текст.
  solo: "solo performance, one single instrument only, no accompaniment, no drums, no percussion, no other instruments"
  genres:
    underscore:  { label: "Нейтральный фон", text: "subtle unobtrusive cinematic background, simple sparse melody" }
    drama:       { label: "Драма", text: "dramatic emotional film score feeling, expressive phrasing" }
    comedy:      { label: "Комедия", text: "quirky comedic tune, bouncy staccato phrases" }
    noir:        { label: "Нуар/детектив", text: "film noir detective jazz, smoky bluesy phrasing" }
    thriller:    { label: "Триллер", text: "thriller suspense, repetitive ostinato, pulsing" }
    horror:      { label: "Ужасы", text: "horror, eerie dissonant intervals, unsettling, sparse" }
    romance:     { label: "Романтика", text: "romantic, warm lyrical melody" }
    western:     { label: "Вестерн", text: "spaghetti western, twangy, wide open desert feeling" }
    action:      { label: "Экшн/погоня", text: "action chase, driving fast repeated notes, urgent" }
    fantasy:     { label: "Сказка/фэнтези", text: "fairy tale fantasy, magical, whimsical" }
    scifi:       { label: "Фантастика", text: "science fiction, spacey arpeggios, otherworldly" }
    epic:        { label: "Эпос", text: "epic heroic grand melody, triumphant phrasing" }
    cartoon:     { label: "Мультфильм", text: "cartoon music, playful bouncy slapstick tune" }
    lounge:      { label: "Бар/лаунж", text: "lounge jazz, smooth relaxed bar music" }
    period:      { label: "Старина/классика", text: "baroque classical period style, ornamented melody" }
    folk:        { label: "Деревня/фолк", text: "folk tune, rustic village dance feeling" }
    electronic:  { label: "Клуб/электроника", text: "electronic dance groove feeling, repetitive hypnotic riff" }
    sport:       { label: "Спорт/соревнование", text: "sports anthem, energetic rousing riff" }
  moods:
    tense:       { label: "напряжение", text: "tense, suspenseful", fallback: tension }
    ominous:     { label: "угроза", text: "ominous, dark, threatening", fallback: tension }
    mysterious:  { label: "загадка", text: "mysterious, curious, enigmatic", fallback: tension }
    anxious:     { label: "тревога", text: "anxious, nervous, uneasy", fallback: tension }
    sad:         { label: "грусть", text: "sad, melancholic, sorrowful" }
    tender:      { label: "нежность", text: "tender, loving, intimate", fallback: romantic }
    happy:       { label: "радость", text: "happy, cheerful, bright" }
    playful:     { label: "озорство", text: "playful, mischievous, light-hearted" }
    absurd:      { label: "абсурд", text: "absurd, silly, clumsy, comedic" }
    triumphant:  { label: "триумф", text: "triumphant, victorious, uplifting" }
    calm:        { label: "спокойствие", text: "calm, peaceful, relaxed" }
    nostalgic:   { label: "ностальгия", text: "nostalgic, wistful, bittersweet" }
  energy:
    low:    { label: "тихо", config: { density: 0.2, brightness: 0.3 } }
    medium: { label: "средне", config: { density: 0.45, brightness: 0.5 } }
    high:   { label: "мощно", config: { density: 0.75, brightness: 0.65 } }
  # Инструмент — всегда один. Модель выбирает его на сцену; в соседних сценах инструмент не повторяется.
  instruments:
    guitar:      { label: "гитара", text: "solo acoustic guitar, fingerpicking" }
    electric:    { label: "электрогитара", text: "solo clean electric guitar with reverb" }
    piano:       { label: "фортепиано", text: "solo piano" }
    violin:      { label: "скрипка", text: "solo violin" }
    cello:       { label: "виолончель", text: "solo cello" }
    banjo:       { label: "банджо", text: "solo banjo" }
    harmonica:   { label: "губная гармошка", text: "solo harmonica" }
    accordion:   { label: "аккордеон", text: "solo accordion" }
    ukulele:     { label: "укулеле", text: "solo ukulele" }
    mandolin:    { label: "мандолина", text: "solo mandolin" }
    balalaika:   { label: "балалайка", text: "solo balalaika, russian folk" }
    harp:        { label: "арфа", text: "solo harp" }
    flute:       { label: "флейта", text: "solo flute" }
    clarinet:    { label: "кларнет", text: "solo clarinet" }
    saxophone:   { label: "саксофон", text: "solo saxophone" }
    trumpet:     { label: "труба", text: "solo muted trumpet" }
    marimba:     { label: "маримба/ксилофон", text: "solo marimba" }
    musicbox:    { label: "музыкальная шкатулка", text: "solo music box, celesta" }
    harpsichord: { label: "клавесин", text: "solo harpsichord" }
    synth:       { label: "синтезатор", text: "solo analog synthesizer lead, no drums" }
  # Темп — словами, а не bpm: смена bpm в Lyria требует сброса и звучит обрывом, а слова перетекают плавно.
  tempo:
    slow:   { label: "медленно", text: "slow tempo" }
    medium: { label: "умеренно", text: "moderate tempo" }
    fast:   { label: "быстро", text: "fast tempo, driving rhythm" }

# Пул записанных мелодий: по 5 на жанр, у каждой свой инструмент (настроение/энергия/темп/инструмент).
# Играют с ручных кнопок жанров на пульте (повторное нажатие — следующая, с плавным переходом) и
# служат резервом, если генератор недоступен (нет интернета). Файлы — sounds/pool/<жанр>/<n>-<инструмент>.flac,
# создаются командой `python -m soundmaster make-music-pool` (Lyria, нужен GEMINI_API_KEY). В git не кладутся.
music_pool:
  underscore:  [calm/low/slow/piano, calm/low/slow/guitar, mysterious/low/slow/harp, nostalgic/low/slow/cello, tender/low/medium/musicbox]
  drama:       [tense/low/slow/cello, sad/low/slow/piano, tense/medium/medium/violin, nostalgic/low/slow/guitar, sad/low/slow/clarinet]
  comedy:      [playful/medium/medium/ukulele, absurd/medium/fast/clarinet, playful/low/medium/marimba, absurd/medium/medium/accordion, playful/medium/fast/banjo]
  noir:        [mysterious/low/slow/saxophone, tense/low/slow/trumpet, mysterious/low/medium/piano, ominous/low/slow/electric, nostalgic/low/slow/clarinet]
  thriller:    [tense/medium/medium/synth, anxious/low/medium/piano, ominous/low/slow/cello, tense/medium/fast/violin, mysterious/low/slow/electric]
  horror:      [ominous/low/slow/musicbox, ominous/low/slow/cello, anxious/low/slow/violin, mysterious/low/slow/piano, ominous/low/slow/harp]
  romance:     [tender/low/slow/piano, tender/low/slow/guitar, nostalgic/low/slow/violin, happy/low/medium/mandolin, tender/low/slow/saxophone]
  western:     [tense/low/slow/harmonica, calm/low/slow/guitar, playful/medium/medium/banjo, tense/medium/medium/electric, nostalgic/low/slow/trumpet]
  action:      [tense/high/fast/violin, tense/high/fast/electric, anxious/high/fast/piano, triumphant/high/fast/trumpet, tense/high/fast/synth]
  fantasy:     [mysterious/low/slow/harp, happy/low/medium/flute, tender/low/slow/musicbox, playful/medium/medium/clarinet, mysterious/low/medium/marimba]
  scifi:       [mysterious/low/slow/synth, mysterious/low/slow/electric, calm/low/slow/piano, mysterious/low/medium/harp, tense/medium/medium/marimba]
  epic:        [triumphant/high/medium/trumpet, triumphant/medium/medium/piano, tense/high/medium/cello, triumphant/high/medium/violin, nostalgic/medium/slow/flute]
  cartoon:     [playful/medium/fast/marimba, absurd/medium/fast/clarinet, playful/medium/medium/ukulele, absurd/medium/medium/harmonica, playful/medium/fast/piano]
  lounge:      [calm/low/medium/piano, calm/low/medium/saxophone, happy/low/medium/guitar, nostalgic/low/slow/trumpet, calm/low/medium/electric]
  period:      [calm/low/medium/harpsichord, tender/low/slow/violin, happy/medium/medium/flute, nostalgic/low/slow/cello, calm/low/slow/harp]
  folk:        [happy/medium/medium/accordion, nostalgic/low/slow/guitar, playful/medium/fast/mandolin, happy/medium/medium/balalaika, tender/low/slow/violin]
  electronic:  [happy/medium/medium/synth, calm/low/medium/electric, playful/medium/medium/marimba, mysterious/low/medium/piano, tense/high/fast/synth]
  sport:       [triumphant/high/fast/electric, triumphant/high/medium/trumpet, tense/high/fast/synth, happy/high/fast/piano, triumphant/high/fast/violin]
