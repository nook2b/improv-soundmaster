# Текущая конфигурация: рекордер у сцены, подключённый к Mac по USB как аудиоинтерфейс.
# Узнать имя устройства: python -m soundmaster devices
name: recorder
device: null            # подстрока имени, например "H5", "H6", "Tascam"; null — вход по умолчанию
sample_rate: 48000
channels:
  - { channel: 1, role: stage_mix, name: "Рекордер L" }
  - { channel: 2, role: stage_mix, name: "Рекордер R" }
notes: >
  Рекордер слышит актёров, зал и колонки. Чистого звука актёров нет: автоматика в зал
  выключена (только подсказки), локальные триггеры по резким звукам не используются.
