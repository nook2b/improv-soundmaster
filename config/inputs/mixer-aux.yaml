# Будущая конфигурация: петлички → микшер. В Mac приходят:
#   - отдельный выход микшера (aux, pre-fader) только с микрофонами актёров — для AI;
#   - микрофон зала — для анализа реакции.
# Выход Mac идёт в микшер отдельным каналом, который НЕ подмешивается в этот aux.
# Подключение: aux и микрофон зала → входы небольшого аудиоинтерфейса (например Focusrite 2i2).
name: mixer-aux
device: "Scarlett"      # подстрока имени интерфейса
sample_rate: 48000
channels:
  - { channel: 1, role: actors_aux, name: "Микшер aux: актёры" }
  - { channel: 2, role: room, name: "Микрофон зала" }
notes: >
  Если микшер цифровой и работает как USB-интерфейс с отдельными дорожками, используйте
  профиль lavaliers-interface.yaml с его каналами.
